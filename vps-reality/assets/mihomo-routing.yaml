dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    'geosite:cn,private':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    proxies:
      - "♻️ 自动选择"
      - DIRECT
  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🤖 AI 服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🐙 GitHub"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "📹 YouTube"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🎬 Netflix"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🌍 国外媒体"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "📲 Telegram"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - DIRECT
  - name: "🍎 Apple 服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
  - name: "Ⓜ️ Microsoft 服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
  - name: "🌏 国内服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT
rule-providers:
  reject:
    type: http
    behavior: domain
    format: yaml
    path: ./ruleset/meta-reject.yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml
    interval: 86400
